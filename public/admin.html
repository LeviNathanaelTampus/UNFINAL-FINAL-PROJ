<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard — GoodNeighbor Health</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <div class="container">
      <div class="page-header"><div><h1>Admin dashboard</h1><p>Platform oversight, professional verification, and moderation.</p></div></div>
      <div class="tabs" role="tablist" aria-label="Admin sections" id="tabs">
        <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button class="tab" role="tab" data-tab="verifications">Verifications <span class="badge badge-red" id="ver-count" hidden></span></button>
        <button class="tab" role="tab" data-tab="users">Users</button>
        <button class="tab" role="tab" data-tab="initiatives">Initiatives</button>
        <button class="tab" role="tab" data-tab="organizations">Organizations</button>
        <button class="tab" role="tab" data-tab="payments">Payments</button>
        <button class="tab" role="tab" data-tab="activity">Activity log</button>
      </div>
      <div id="panel"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
