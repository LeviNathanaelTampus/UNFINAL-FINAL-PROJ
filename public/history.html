<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participation history — GoodNeighbor Health</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <div class="container">
      <div class="page-header"><div><h1>Participation history</h1><p>Your registrations, attendance, and hosted initiatives. Cancelled records are kept for your history.</p></div><a href="/explore.html" class="btn btn-primary">Find initiatives</a></div>
      <div class="tabs" role="tablist" aria-label="History" id="tabs">
        <button class="tab" role="tab" data-tab="upcoming" aria-selected="true">Upcoming</button>
        <button class="tab" role="tab" data-tab="past">Past & completed</button>
        <button class="tab" role="tab" data-tab="all">All registrations</button>
        <button class="tab" role="tab" data-tab="hosted">Hosted by me</button>
      </div>
      <div id="stats" class="mb-2"></div>
      <div class="card"><div id="list"></div></div>
      <div id="pager"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/history.js"></script>
</body>
</html>
